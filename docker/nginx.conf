# 多副本网关: 单端口对外, 请求按 DNS 轮询分发到各 api 副本.
#
# 为什么用变量 + resolver 而不是 upstream 块:
#   upstream 在启动时解析一次 api 的 A 记录, 之后扩缩容不会生效;
#   用 compose 内置 DNS(127.0.0.11) + 变量 proxy_pass, 每 valid 秒重新解析,
#   副本数量变化后无需重启网关。

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket 与 SSE 需要长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            set $upstream http://api:8000;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
